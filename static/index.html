<body class="bg-[#F8FAFC] text-slate-900 min-h-screen flex flex-col font-sans selection:bg-emerald-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- CONTINUOUS MOCK DATA UTILITIES ---
    let globalStep = 0;

    function generateSeedData(count = 35) {
      const list = [];
      const now = Date.now();
      let cumulativeEnergy = 16.75;

      for (let i = count - 1; i >= 0; i--) {
        const time = new Date(now - i * 1800);
        const step = count - i;
        const drift = Math.sin(step * 0.1) * 0.3;
        const noiseV = (Math.sin(step * 0.4) * 0.08);
        const noiseI = (Math.cos(step * 0.3) * 0.05);

        const voltage = Number((12.45 + drift + noiseV).toFixed(2));
        const current = Number((1.90 + (drift * 0.3) + noiseI).toFixed(2));
        const expectedPower = Number((voltage * current).toFixed(2));
        
        const isAnomaly = i === 12;
        const reportedPower = isAnomaly 
          ? Number((expectedPower * 1.82).toFixed(2))
          : expectedPower;
        
        const power = reportedPower;
        const status = isAnomaly ? 'ANOMALY' : 'NORMAL';
        const reason = isAnomaly 
          ? `Physics Violation: Reported ${reportedPower}W exceeds V×I (${expectedPower}W) by +82.0%`
          : 'Verified: Ohm & Joule Law consistent (tolerance ±0.2%)';
        
        const energyIncrement = (power / 1000) * (1.8 / 3600);
        if (!isAnomaly) cumulativeEnergy += energyIncrement;

        list.push({
          id: 1000 + step,
          device_id: 'SOLAR_ESP32_001',
          voltage,
          current,
          power,
          expected_power: expectedPower,
          temperature: Number((29.5 + (drift * 0.5) + (Math.sin(step) * 0.2)).toFixed(1)),
          humidity: Number((58.0 - (drift * 0.4) + (Math.cos(step) * 0.3)).toFixed(1)),
          irradiance: Math.round(840 + (drift * 45) + (Math.sin(step * 0.2) * 15)),
          status,
          reason,
          confidence: isAnomaly ? 0.61 : 0.995,
          timestamp: time.toISOString(),
          energy_kwh: Number(cumulativeEnergy.toFixed(5)),
          co2_kg: Number((cumulativeEnergy * 0.82).toFixed(5)),
          carbon_credits: Number(((cumulativeEnergy * 0.82) / 1000).toFixed(8))
        });
      }
      globalStep = count;
      return list;
    }

    function generateNextPacket(prevPacket, forceAnomaly = false) {
      globalStep += 1;
      const drift = Math.sin(globalStep * 0.08) * 0.32;
      const noiseV = ((Math.random() - 0.5) * 0.1);
      const noiseI = ((Math.random() - 0.5) * 0.08);

      const voltage = Number(Math.max(11.8, Math.min(13.2, 12.45 + drift + noiseV)).toFixed(2));
      const current = Number(Math.max(1.4, Math.min(2.4, 1.90 + (drift * 0.35) + noiseI)).toFixed(2));
      const expectedPower = Number((voltage * current).toFixed(2));

      const shouldBeAnomaly = forceAnomaly || (globalStep > 0 && globalStep % 19 === 0);
      
      let reportedPower = expectedPower;
      let status = 'NORMAL';
      let reason = 'Verified: Deterministic physical law confirmed (P = V × I)';
      let confidence = 0.996;

      if (shouldBeAnomaly) {
        status = 'ANOMALY';
        const multiplier = Math.random() > 0.5 ? 1.85 : 0.42;
        reportedPower = Number((expectedPower * multiplier).toFixed(2));
        const pctDiff = (((reportedPower - expectedPower) / expectedPower) * 100).toFixed(1);
        reason = `Ohm's Law Violation: Reported ${reportedPower}W diverges from V×I (${expectedPower}W) by ${pctDiff > 0 ? '+' : ''}${pctDiff}%`;
        confidence = 0.58;
      }

      const tempDrift = (Math.random() - 0.5) * 0.2;
      const humDrift = (Math.random() - 0.5) * 0.3;
      const temperature = Number(Math.max(26.0, Math.min(36.0, 29.8 + (drift * 0.4) + tempDrift)).toFixed(1));
      const humidity = Number(Math.max(45.0, Math.min(75.0, 58.5 - (drift * 0.3) + humDrift)).toFixed(1));
      const irradiance = Math.round(Math.max(650, Math.min(980, 855 + (drift * 55) + ((Math.random() - 0.5) * 20))));

      return {
        id: 1000 + globalStep,
        device_id: 'SOLAR_ESP32_001',
        voltage,
        current,
        power: reportedPower,
        expected_power: expectedPower,
        temperature,
        humidity,
        irradiance,
        status,
        reason,
        confidence,
        timestamp: new Date().toISOString()
      };
    }

    const defaultSummary = {
      total_readings: 1460,
      verified_readings: 1448,
      anomaly_readings: 12,
      total_energy_kwh: 18.6420,
      total_co2_reduced_kg: 15.2864,
      total_carbon_credits: 0.0152864,
      active_nodes: 4,
      system_efficiency: 98.7,
      performance_ratio: 0.88,
      grid_carbon_factor: 0.82,
      status: 'ONLINE'
    };

              <div>

                    dMRV Platform

            </div>

            {/* Nav Tabs */}

                { id: 'telemetry', label: 'Live Telemetry', icon: 'activity' },

              >

                  {isStreaming && <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>}

                </span>
                <span>{isStreaming ? 'LIVE (1.5s)' : 'PAUSED'}</span>
              </button>

              {/* Test Anomaly Trigger */}
              <button
                onClick={onTriggerAnomaly}
                className="flex items-center gap-1.5 text-[11px] font-medium text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 px-2.5 py-1.5 rounded-lg transition-colors cursor-pointer"
              >
                <i data-lucide="alert-triangle" className="w-3.5 h-3.5 text-amber-600"></i>
                <span>Test Anomaly</span>
              </button>

              {/* Network Pill */}
              <div className="hidden sm:flex items-center gap-1.5 text-[11px] font-medium text-purple-700 bg-purple-50 border border-purple-200 px-2.5 py-1.5 rounded-lg">
                <span className="w-1.5 h-1.5 rounded-full bg-purple-600"></span>
                <span>Polygon Amoy</span>
              </div>

              {/* Wallet Pill */}
              <div className="text-xs font-mono font-semibold px-3 py-1.5 bg-slate-900 text-white rounded-lg shadow-2xs">
                {walletAddress ? `${walletAddress.slice(0, 6)}...${walletAddress.slice(-4)}` : '0x71C7...976F'}
              </div>
            </div>

          </div>
        </header>
      );
    }

    // --- TELEMETRY TAB (DASHBOARD) ---
    function TelemetryTab({ latestPacket, summary, packetLogs, onMintCert, onResetSession }) {
      const p = latestPacket || {
        voltage: 12.48, current: 1.95, power: 24.34, expected_power: 24.34,
        temperature: 29.8, humidity: 58.2, irradiance: 855, status: 'NORMAL',
        reason: 'Verified: Ohm & Joule Law consistent (tolerance ±0.2%)', timestamp: new Date().toISOString()
      };

      const s = summary || defaultSummary;
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        if (!chartRef.current) return;
        const ctx = chartRef.current.getContext('2d');
        const labels = [...packetLogs].slice(0, 25).reverse().map(l => 
          new Date(l.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
        );
        const reportedData = [...packetLogs].slice(0, 25).reverse().map(l => l.power);
        const expectedData = [...packetLogs].slice(0, 25).reverse().map(l => l.expected_power);

        if (chartInstance.current) {
          chartInstance.current.data.labels = labels;
          chartInstance.current.data.datasets[0].data = reportedData;
          chartInstance.current.data.datasets[1].data = expectedData;
          chartInstance.current.update('none');
        } else {
          chartInstance.current = new Chart(ctx, {
            type: 'line',
            data: {
              labels,
              datasets: [
                {
                  label: 'Reported Power (W)',
                  data: reportedData,
                  borderColor: '#2563EB',
                  backgroundColor: 'rgba(37, 99, 235, 0.06)',
                  borderWidth: 2.2,
                  fill: true,
                  tension: 0.35,
                  pointRadius: 0
                },
                {
                  label: 'Expected V×I (W)',
                  data: expectedData,
                  borderColor: '#F59E0B',
                  borderWidth: 1.8,
                  borderDash: [4, 4],
                  fill: false,
                  tension: 0.35,
                  pointRadius: 0
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              animation: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  backgroundColor: '#FFFFFF',
                  titleColor: '#64748B',
                  bodyColor: '#0F172A',
                  borderColor: '#E2E8F0',
                  borderWidth: 1,
                  padding: 10,
                  boxPadding: 4,
                  displayColors: true
                }
              },
              scales: {
                x: {
                  grid: { display: false },
                  ticks: { color: '#64748B', font: { size: 10 } }
                },
                y: {
                  grid: { color: '#F1F5F9' },
                  ticks: { color: '#64748B', font: { size: 10 } }
                }
              }
            }
          });
        }
      }, [packetLogs]);

      return (
        <div className="space-y-6">
          
          {/* Node Summary Banner */}

            <div>
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold uppercase tracking-wider text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
                  Node 01 • Active
                </span>
                <span className="text-xs text-slate-500 font-mono">ID: SOLAR_ESP32_001</span>
              </div>
              <h2 className="text-xl font-bold text-slate-900 mt-1">Pune Rooftop Solar Array (24 kWp Microgrid)</h2>
              <p className="text-xs text-slate-500 mt-0.5">
                Continuous IoT dMRV telemetry &bull; MPPT: Active &bull; Ambient: 29.8&deg;C &bull; Irradiance: {p.irradiance || 855} W/m&sup2;
              </p>
            </div>

            <div className="flex items-center gap-3">
              <div className="text-right">
                <div className="text-[11px] font-semibold text-slate-400 uppercase">System PR</div>
                <div className="text-lg font-bold font-mono text-emerald-600">98.7%</div>
              </div>
              <div className="h-8 w-px bg-slate-200"></div>
              <div className="text-right">
                <div className="text-[11px] font-semibold text-slate-400 uppercase">Grid Factor</div>
                <div className="text-lg font-bold font-mono text-slate-800">0.82 kg/kWh</div>
              </div>
            </div>
          </div>

          {/* 4 Primary KPI Cards */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            
            <div className="panel-card panel-card-hover p-5 border-l-4 border-l-amber-500">
              <div className="flex items-center justify-between">
                <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500">Live Power Output</span>
                <span className="p-1.5 rounded-lg bg-amber-50 text-amber-600"><i data-lucide="zap" className="w-4 h-4"></i></span>
              </div>
              <div className="text-3xl font-extrabold text-slate-900 mt-2 font-mono tracking-tight">
                {p.power.toFixed(1)} <span className="text-sm font-sans font-semibold text-amber-600">W</span>
              </div>
              <div className="flex items-center justify-between text-[11px] text-slate-500 mt-2 pt-2 border-t border-slate-100">
                <span>Expected: {p.expected_power.toFixed(1)} W</span>
                <span className={Math.abs(p.power - p.expected_power) > 2 ? 'text-rose-600 font-bold' : 'text-emerald-600 font-semibold'}>
                  Δ {Math.abs(p.power - p.expected_power).toFixed(1)} W
                </span>
              </div>
            </div>

            <div className="panel-card panel-card-hover p-5 border-l-4 border-l-blue-500">
              <div className="flex items-center justify-between">
                <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500">Cumulative Clean Energy</span>
                <span className="p-1.5 rounded-lg bg-blue-50 text-blue-600"><i data-lucide="sun" className="w-4 h-4"></i></span>
              </div>
              <div className="text-3xl font-extrabold text-slate-900 mt-2 font-mono tracking-tight">
                {s.total_energy_kwh.toFixed(4)} <span className="text-sm font-sans font-semibold text-blue-600">kWh</span>
              </div>
              <div className="flex items-center justify-between text-[11px] text-slate-500 mt-2 pt-2 border-t border-slate-100">
                <span>Accumulating live</span>
                <span className="text-blue-600 font-semibold">MPPT Tracked</span>
              </div>
            </div>

            <div className="panel-card panel-card-hover p-5 border-l-4 border-l-emerald-500">
              <div className="flex items-center justify-between">
                <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500">CO₂ Avoided</span>
                <span className="p-1.5 rounded-lg bg-emerald-50 text-emerald-600"><i data-lucide="sprout" className="w-4 h-4"></i></span>
              </div>
              <div className="text-3xl font-extrabold text-emerald-600 mt-2 font-mono tracking-tight">
                {s.total_co2_reduced_kg.toFixed(4)} <span className="text-sm font-sans font-semibold text-emerald-700">kg</span>
              </div>
              <div className="flex items-center justify-between text-[11px] text-slate-500 mt-2 pt-2 border-t border-slate-100">
                <span>0.82 kg/kWh Factor</span>
                <span className="text-emerald-700 font-semibold">Scope 2 Reduction</span>
              </div>
            </div>

            <div className="panel-card panel-card-hover p-5 border-l-4 border-l-purple-500">
              <div className="flex items-center justify-between">
                <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500">Verified Carbon Credits</span>
                <span className="p-1.5 rounded-lg bg-purple-50 text-purple-600"><i data-lucide="award" className="w-4 h-4"></i></span>
              </div>
              <div className="text-3xl font-extrabold text-purple-700 mt-2 font-mono tracking-tight">
                {s.total_carbon_credits.toFixed(7)}
              </div>
              <div className="flex items-center justify-between text-[11px] text-slate-500 mt-2 pt-2 border-t border-slate-100">
                <span>1 Credit = 1000 kg CO₂</span>
                <span className="text-purple-600 font-semibold">Polygon Amoy</span>
              </div>
            </div>

          </div>

          {/* Main Chart + Node Diagnostics */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            {/* Chart Area */}
            <div className="lg:col-span-2 panel-card p-6 flex flex-col justify-between">
              <div className="flex items-center justify-between mb-4">
                <div>
                  <h3 className="text-[15px] font-bold text-slate-900">Live Power Output vs Physical Determinism</h3>
                  <p className="text-xs text-slate-500">Ohm's &amp; Joule's physical law cross-check (P = V &times; I &plusmn; 2.0%)</p>
                </div>
                <div className="flex items-center gap-3 text-xs">
                  <span className="flex items-center gap-1.5 text-slate-700 font-medium">
                    <span className="w-2.5 h-2.5 rounded-full bg-blue-600"></span> Reported (W)
                  </span>
                  <span className="flex items-center gap-1.5 text-slate-700 font-medium">
                    <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Expected (W)
                  </span>
                </div>
              </div>

              <div className="h-64 w-full">
                <canvas ref={chartRef}></canvas>
              </div>

              <div className="flex items-center justify-between text-[11px] text-slate-500 pt-3 border-t border-slate-100 mt-2">
                <span>Streaming 25 rolling cycles &bull; Cadence 1.5s</span>
                <span className="text-emerald-700 font-semibold flex items-center gap-1">
                  <i data-lucide="check-circle-2" className="w-3.5 h-3.5"></i> Physics Cross-Check Active
                </span>
              </div>
            </div>

            {/* Diagnostics Card */}
            <div className="panel-card flex flex-col justify-between">
              <div className="p-6 border-b border-slate-100">
                <h3 className="text-[15px] font-bold text-slate-900 mb-4 flex items-center gap-2">
                  <i data-lucide="cpu" className="w-4 h-4 text-emerald-600"></i>
                  Live Node Diagnostics
                </h3>

                <div className="space-y-3 text-[13px]">
                  <div className="flex justify-between py-1 border-b border-slate-50">
                    <span className="text-slate-500">Panel Voltage (V)</span>
                    <span className="font-mono font-semibold text-slate-800">{p.voltage.toFixed(2)} V</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-50">
                    <span className="text-slate-500">Panel Current (I)</span>
                    <span className="font-mono font-semibold text-slate-800">{p.current.toFixed(2)} A</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-50">
                    <span className="text-slate-500">Cell Temperature</span>
                    <span className="font-mono font-semibold text-slate-800">{p.temperature.toFixed(1)} &deg;C</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-50">
                    <span className="text-slate-500">Relative Humidity</span>
                    <span className="font-mono font-semibold text-slate-800">{p.humidity ? p.humidity.toFixed(1) : '58.0'} %</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-50">
                    <span className="text-slate-500">Solar Irradiance</span>
                    <span className="font-mono font-semibold text-amber-600">{p.irradiance || 855} W/m&sup2;</span>
                  </div>

    // --- PREDICTION LOGS TAB ---
    function PredictionLogsTab({ mockLogs = [] }) {
      const [filterStatus, setFilterStatus] = useState('ALL');
      const filtered = mockLogs.filter(l => 
        filterStatus === 'ALL' || 
        (filterStatus === 'NORMAL' && l.status !== 'ANOMALY') || 
        (filterStatus === 'ANOMALY' && l.status === 'ANOMALY')
      );

      return (
        <div className="space-y-6">
          <div className="panel-card p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl font-bold text-slate-900">Prediction Logs &amp; Audit Trail</h2>
              <p className="text-xs text-slate-500 mt-0.5">Every telemetry packet verified and recorded in sequence</p>
            </div>
            <div className="flex gap-2">
              {['ALL', 'NORMAL', 'ANOMALY'].map(st => (
                <button
                  key={st}
                  onClick={() => setFilterStatus(st)}
                  className={`px-3 py-1 text-xs font-semibold rounded-lg ${
                    filterStatus === st ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'
                  }`}
                >
                  {st === 'ALL' ? 'All' : st === 'NORMAL' ? 'Verified' : 'Anomalies'}
                </button>
              ))}
            </div>
          </div>

          <div className="panel-card overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-50 text-slate-600 font-semibold uppercase border-b border-slate-200">
                  <tr>
                    <th className="px-5 py-3">Timestamp</th>
                    <th className="px-5 py-3">Device</th>
                    <th className="px-5 py-3">Voltage (V)</th>
                    <th className="px-5 py-3">Current (A)</th>
                    <th className="px-5 py-3">Reported (W)</th>
                    <th className="px-5 py-3">Expected (W)</th>
                    <th className="px-5 py-3">Temp / Hum</th>
                    <th className="px-5 py-3">Status</th>
                    <th className="px-5 py-3">Details</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 font-mono">
                  {filtered.slice(0, 30).map((log, idx) => (
                    <tr key={log.id || idx} className={log.status === 'ANOMALY' ? 'bg-rose-50/60' : 'hover:bg-slate-50'}>
                      <td className="px-5 py-3 text-slate-600 font-sans">{new Date(log.timestamp).toLocaleTimeString()}</td>
                      <td className="px-5 py-3 font-semibold text-slate-800">{log.device_id}</td>
                      <td className="px-5 py-3 text-slate-700">{log.voltage.toFixed(2)} V</td>
                      <td className="px-5 py-3 text-slate-700">{log.current.toFixed(2)} A</td>
                      <td className={`px-5 py-3 font-bold ${log.status === 'ANOMALY' ? 'text-rose-700' : 'text-slate-900'}`}>{log.power.toFixed(2)} W</td>
                      <td className="px-5 py-3 text-slate-500">{log.expected_power.toFixed(2)} W</td>
                      <td className="px-5 py-3 text-slate-600">{log.temperature.toFixed(1)}&deg;C / {log.humidity ? log.humidity.toFixed(0) : '58'}%</td>
                      <td className="px-5 py-3">
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${log.status === 'ANOMALY' ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'}`}>
                          {log.status}
                        </span>
                      </td>
                      <td className="px-5 py-3 font-sans text-slate-500 truncate max-w-xs">{log.reason}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // --- MAIN APP ---
    function App() {
      const [activeTab, setActiveTab] = useState('telemetry');
      const [isStreaming, setIsStreaming] = useState(true);
      const [packetLogs, setPacketLogs] = useState(() => generateSeedData(35));
      const [latestPacket, setLatestPacket] = useState(() => packetLogs[0]);
      const [summary, setSummary] = useState(defaultSummary);
      const [forceAnomaly, setForceAnomaly] = useState(false);
      const walletAddress = '0x71C7656EC7ab88b098defB751B7401B5f6d8976F';

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, packetLogs]);

      // Continuous Mock Generator
      useEffect(() => {
        if (!isStreaming) return;
        const timer = setInterval(() => {
          setLatestPacket(prev => {
            const next = generateNextPacket(prev, forceAnomaly);
            if (forceAnomaly) setForceAnomaly(false);

            setSummary(prevSum => {
              const energyIncr = (next.power / 1000) * (1.5 / 3600);
              const newEnergy = prevSum.total_energy_kwh + energyIncr;
              const newCo2 = newEnergy * 0.82;
              const isAnom = next.status === 'ANOMALY';
              return {
                ...prevSum,
                total_energy_kwh: Number(newEnergy.toFixed(5)),
                total_co2_reduced_kg: Number(newCo2.toFixed(5)),
                total_carbon_credits: Number((newCo2 / 1000).toFixed(8)),
                total_readings: prevSum.total_readings + 1,
                verified_readings: prevSum.verified_readings + (isAnom ? 0 : 1),
                anomaly_readings: prevSum.anomaly_readings + (isAnom ? 1 : 0),
              };
            });

            setPacketLogs(prevLogs => [next, ...prevLogs.slice(0, 49)]);
            return next;
          });
        }, 1500);

        return () => clearInterval(timer);
      }, [isStreaming, forceAnomaly]);

      // Background WebSocket sync if FastAPI server active
      useEffect(() => {
        let ws = null;
        try {
          const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          ws = new WebSocket(`${protocol}//${window.location.host}/ws/live`);
          ws.onmessage = (event) => {
            try {
              const msg = JSON.parse(event.data);
              if (msg.type === 'NEW_READING' && msg.data) {
                setLatestPacket(msg.data);
                setPacketLogs(prev => [msg.data, ...prev.filter(x => x.id !== msg.data.id).slice(0, 49)]);
              }
            } catch(e) {}
          };
        } catch(e) {}
        return () => { if (ws) ws.close(); };
      }, []);

      const mintCert = () => {
        alert(`Successfully minted Digital Carbon Certificate for ${summary.total_energy_kwh.toFixed(4)} kWh on Polygon Amoy!`);
        setActiveTab('certificates');
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#F8FAFC]">
          <Navbar 
            activeTab={activeTab} 
            setActiveTab={setActiveTab}
            isStreaming={isStreaming}
            onToggleStreaming={() => setIsStreaming(!isStreaming)}
            onTriggerAnomaly={() => setForceAnomaly(true)}
            walletAddress={walletAddress}
          />
          
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {activeTab === 'telemetry' && (
              <TelemetryTab
                latestPacket={latestPacket}
                summary={summary}
                packetLogs={packetLogs}
                onMintCert={mintCert}
              />
            )}
            {activeTab === 'ai' && <AIVerificationTab summary={summary} packetLogs={packetLogs} />}
            {activeTab === 'certificates' && <CertificateTab summary={summary} />}
            {activeTab === 'marketplace' && <MarketplaceTab walletAddress={walletAddress} />}
            {activeTab === 'prediction-logs' && <PredictionLogsTab mockLogs={packetLogs} />}
          </main>

          <footer className="border-t border-slate-200 bg-white py-6 mt-auto">
            <div className="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 space-y-1">
              <div className="font-semibold text-slate-700">RenewCred Decarbonization Platform — Industrial Monitoring Interface</div>
              <div className="text-[11px] text-slate-400">ESP32 Telemetry &bull; AI Verification (dMRV) &bull; Carbon Engine &bull; Polygon Blockchain &bull; ESG Marketplace</div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
